# Nginx konfiguracija za aplikaciju Racuni Struja
# Server: karpas.app (HTTPS)
# Javna putanja: https://karpas.app/struja
#
# Dodaj location blokove ispod UNUTAR POSTOJECEG server bloka (listen 443 ssl)
# za karpas.app. Novi sertifikat ne treba.

location = /struja {
    return 301 /struja/;
}

# Proxy svih zahtjeva /struja/ na Express (port 3011, jer 3010 koristi sistem monitor)
location /struja/ {
    proxy_pass http://localhost:3011/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Nginx podrazumijevano odbija tijelo vece od 1 MB, a limit servera za PDF je 5 MB
    client_max_body_size 5m;
}

# -------------------------------------------------------------------
# DEPLOYMENT KORACI NA SERVERU (karpas.app):
#
# 1. Provjeri da port 3011 nije zauzet
#    sudo ss -ltnp | grep 3011
#
# 2. Kloniraj projekat i instaliraj dependencije
#    git clone https://github.com/DrazenPetrovic/racuniStruja.git /home/korisnik/racuniStruja
#    cd /home/korisnik/racuniStruja
#    npm install
#
# 3. Kreiraj bazu i tabelu (samo jednom). Zatim pokreni CREATE USER i GRANT
#    sa kraja docs/schema.sql, sa svojom lozinkom.
#    mysql -u root -p < docs/schema.sql
#
# 4. Kreiraj .env (kopiraj .env.example, popuni vrijednosti i postavi PORT=3011)
#    cp .env.example .env
#    npm run lozinka     -> dobijeni red upisi kao APP_PASSWORD_HASH
#    nano .env
#
# 5. Buildiraj frontend i pokreni server sa PM2
#    npm run build
#    pm2 start server.mjs --name struja --cwd /home/korisnik/racuniStruja
#    pm2 save
#
# 6. Dodaj location blokove iznad u POSTOJECI server blok
#    sudo nano /etc/nginx/sites-available/karpas.app
#    sudo nginx -t
#    sudo systemctl reload nginx
# -------------------------------------------------------------------
